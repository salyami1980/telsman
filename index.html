<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>حساب القيمة العددية للحروف</title>
    <link rel="manifest" href="manifest.json">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Arial', sans-serif;
            text-align: center;
            direction: rtl;
            background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb4d);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            max-width: 500px;
            width: 100%;
            background: rgba(255,255,255,0.95);
            border-radius: 24px;
            padding: 30px 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            backdrop-filter: blur(10px);
        }
        h1 {
            color: #1a2a6c;
            font-size: 24px;
            margin-bottom: 20px;
        }
        input[type="text"] {
            padding: 14px;
            width: 90%;
            margin-bottom: 15px;
            font-size: 18px;
            border: 2px solid #ddd;
            border-radius: 12px;
            text-align: center;
            font-family: inherit;
        }
        button {
            padding: 12px 24px;
            font-size: 16px;
            cursor: pointer;
            background: #1a2a6c;
            color: white;
            border: none;
            border-radius: 12px;
            margin: 5px;
            transition: transform 0.2s;
        }
        button:hover {
            transform: scale(1.02);
        }
        button:last-child {
            background: #b21f1f;
        }
        .result-card {
            background: linear-gradient(135deg, #1a2a6c, #2a3a7c);
            color: white;
            padding: 15px;
            margin-top: 15px;
            border-radius: 16px;
            text-align: center;
        }
        .result-card h3 {
            font-size: 18px;
            margin-bottom: 8px;
            opacity: 0.9;
        }
        .result-card .value {
            font-size: 22px;
            font-weight: bold;
            word-wrap: break-word;
        }
        .final-result {
            background: linear-gradient(135deg, #fdbb4d, #ff9800);
            color: #1a2a6c;
        }
        .final-result .value {
            font-size: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>حساب الطلسم</h1>
        <input type="text" id="inputText" placeholder="أدخل النص هنا...">
        <div>
            <button onclick="calculate()">احسب</button>
            <button onclick="reset()">مسح</button>
        </div>
        
        <div id="rightWingResult" class="result-card" style="display: none;">
            <h3>🦅 الجناح الأيمن</h3>
            <div class="value" id="rightWingValue"></div>
        </div>
        
        <div id="leftWingResult" class="result-card" style="display: none;">
            <h3>🦅 الجناح الأيسر</h3>
            <div class="value" id="leftWingValue"></div>
        </div>
        
        <div id="finalLettersResult" class="result-card final-result" style="display: none;">
            <h3>📜 الناتج الحرفي النهائي</h3>
            <div class="value" id="finalLettersValue"></div>
        </div>
    </div>

    <script>
        const lettersValues = {
            'أ': 1, 'ا': 1, 'ب': 2, 'ج': 3, 'د': 4, 'ه': 5, 'و': 6, 'ز': 7, 'ح': 8,
            'ط': 9, 'ي': 10, 'ك': 20, 'ل': 30, 'م': 40, 'ن': 50, 'س': 60, 'ع': 70,
            'ف': 80, 'ص': 90, 'ق': 100, 'ر': 200, 'ش': 300, 'ت': 400, 'ث': 500,
            'خ': 600, 'ذ': 700, 'ض': 800, 'ظ': 900, 'غ': 1000, 'ء': 0, 'ى': 1,
            'ئ': 10, 'ؤ': 6, 'إ': 1
        };

        const phoneticValues = {
            'أ': 'الف', 'ا': 'الف', 'ب': 'با', 'ج': 'جيم', 'د': 'دال', 'ه': 'ها', 'و': 'واو', 'ز': 'زاي', 'ح': 'حا',
            'ط': 'طا', 'ي': 'يا', 'ك': 'كاف', 'ل': 'لام', 'م': 'ميم', 'ن': 'نون', 'س': 'سين', 'ع': 'عين', 'ف': 'فا',
            'ص': 'صاد', 'ق': 'قاف', 'ر': 'را', 'ش': 'شين', 'ت': 'تا', 'ث': 'ثا', 'خ': 'خا', 'ذ': 'ذال', 'ض': 'ضاد',
            'ظ': 'ظا', 'غ': 'غين', 'ء': '', 'ى': ''
        };

        function calculate() {
            const input = document.getElementById('inputText').value;
            if (!input.trim()) {
                alert('الرجاء إدخال نص أولاً');
                return;
            }
            
            let totalValue = 0;
            for (let i = 0; i < input.length; i++) {
                const char = input[i];
                if (lettersValues[char]) {
                    totalValue += lettersValues[char];
                }
            }
            
            const letterResult = convertToLetters(totalValue);
            const phoneticResult = convertToPhonetic(letterResult);
            const phoneticValueResult = calculatePhoneticValue(phoneticResult);
            const phoneticLetterResult = convertToLetters(phoneticValueResult);
            const phoneticPhoneticResult = convertToPhonetic(phoneticLetterResult);
            const phoneticValueForPhoneticResult = calculatePhoneticValue(phoneticPhoneticResult);
            const letterValueForPhoneticResult = convertToLetters(phoneticValueForPhoneticResult);
            const phoneticPhoneticValueResult = convertToPhonetic(letterValueForPhoneticResult);
            const finalPhoneticValue = calculatePhoneticValue(phoneticPhoneticValueResult);
            const finalPhoneticLetterValue = convertToLetters(finalPhoneticValue);
            const finalPhoneticPhoneticValue = convertToPhonetic(finalPhoneticLetterValue);
            const finalPhoneticValueFour = calculatePhoneticValue(finalPhoneticPhoneticValue);
            
            const sumValue = totalValue + phoneticValueResult + phoneticValueForPhoneticResult + finalPhoneticValue + finalPhoneticValueFour;
            const rightWing = calculateDigitSum(sumValue);
            const leftWing = calculateDigitSum(rightWing);
            
            const finalLettersResultText = letterResult + ' ' + phoneticLetterResult + ' ' + letterValueForPhoneticResult + ' ' + finalPhoneticLetterValue;
            
            document.getElementById('rightWingValue').innerHTML = rightWing;
            document.getElementById('leftWingValue').innerHTML = leftWing;
            document.getElementById('finalLettersValue').innerHTML = finalLettersResultText;
            
            document.getElementById('rightWingResult').style.display = 'block';
            document.getElementById('leftWingResult').style.display = 'block';
            document.getElementById('finalLettersResult').style.display = 'block';
        }
        
        function calculateDigitSum(value) {
            let sum = 0;
            const str = Math.abs(value).toString();
            for (let i = 0; i < str.length; i++) {
                sum += parseInt(str[i]);
            }
            return sum;
        }
        
        function convertToLetters(value) {
            const letterValues = Object.entries(lettersValues).sort((a, b) => b[1] - a[1]);
            let result = '';
            let remaining = value;
            while (remaining > 0) {
                for (const [letter, val] of letterValues) {
                    if (remaining >= val) {
                        result = letter + ' ' + result;
                        remaining -= val;
                        break;
                    }
                }
            }
            return result.trim();
        }
        
        function convertToPhonetic(letters) {
            if (!letters) return '';
            return letters.split(' ').map(letter => phoneticValues[letter] || letter).join(' ');
        }
        
        function calculatePhoneticValue(phonetic) {
            let totalValue = 0;
            for (let i = 0; i < phonetic.length; i++) {
                const char = phonetic[i];
                if (lettersValues[char]) {
                    totalValue += lettersValues[char];
                }
            }
            return totalValue;
        }
        
        function reset() {
            document.getElementById('inputText').value = '';
            document.getElementById('rightWingResult').style.display = 'none';
            document.getElementById('leftWingResult').style.display = 'none';
            document.getElementById('finalLettersResult').style.display = 'none';
            document.getElementById('rightWingValue').innerHTML = '';
            document.getElementById('leftWingValue').innerHTML = '';
            document.getElementById('finalLettersValue').innerHTML = '';
        }
    </script>
</body>
</html>
